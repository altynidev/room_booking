server:
  port: ${SERVER_PORT:8080}
  # Honour X-Forwarded-* from the nginx frontend (correct scheme/host in Swagger's server URL).
  forward-headers-strategy: framework

spring:
  application:
    name: room-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roombooking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# Actuator runs on its own port so health checks and metrics are not exposed
# through the public API port (docker-compose does not publish it).
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    # Unset = keep the seed password "admin123" (development only). Set it for any shared instance.
    password: ${ADMIN_PASSWORD:}
  jwt:
    # Development default only - always override JWT_SECRET in real deployments.
    # Must be at least 256 bits (32+ bytes) for HS256.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
