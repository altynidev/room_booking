# Serves the SPA and proxies the API, so the browser talks to a single origin (no CORS).
upstream api {
    server app:8080;
}

# Empty means "don't add": proxied responses keep the backend's own Cache-Control.
map $uri $cache_control {
    ~^/(api|v3/api-docs|swagger-ui)  "";
    ~^/assets/                       "public, max-age=31536000, immutable";  # hashed, never change
    default                          "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No location below sets add_header, so these apply everywhere.
    server_tokens off;
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API and its interactive docs.
    location ~ ^/(api|v3/api-docs|swagger-ui)(/|\.html$|$) {
        proxy_pass http://api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routes (/rooms/1, /bookings, ...) all load index.html.
    location / {
        try_files $uri /index.html;
    }
}
